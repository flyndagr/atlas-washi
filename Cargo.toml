[package]
name = "atlas"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "A local-first notebook and visual research canvas"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
pulldown-cmark = "0.13"
png = "0.18"

[profile.release]
strip = true

